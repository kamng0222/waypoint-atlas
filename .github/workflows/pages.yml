name: Publish Waypoint Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waypoint-atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed authorised publication once
        if: ${{ hashFiles('public_data/network.json.gz') == '' }}
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          archive = Path('navigraph-publication.zip')
          expected = 'efb885362d02433cf4e62fd315222499e58adb03e2b5b4e613bcd9c6863fdfd2'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Publication bundle integrity mismatch'
          allowed = {'web/index.html', 'web/data-source.js', 'tools/build_authorized_public.py', 'PUBLICATION.md', 'DESIGN_AND_HANDOVER.md', 'README.md', 'public_data/network.json.gz', 'public_data/publication.json'}
          with zipfile.ZipFile(archive) as bundle:
              assert set(bundle.namelist()) == allowed, 'Unexpected publication content'
              for name in allowed:
                  destination = Path(name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(bundle.read(name))
          ignore = Path('.gitignore')
          text = ignore.read_text()
          if '!public_data/network.json.gz' not in text:
              ignore.write_text(text + '\n!public_data/network.json.gz\npublic_navigraph_site/\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore web/index.html web/data-source.js tools/build_authorized_public.py PUBLICATION.md DESIGN_AND_HANDOVER.md README.md public_data
          if ! git diff --cached --quiet; then
            git commit -m 'Publish owner-authorised Navigraph AIRAC 2610 graph and viewer'
            git push origin HEAD:main
          fi
      - name: Run graph and HTTP regression tests
        run: python -m unittest discover -s tests -v
      - name: Check browser source syntax
        run: |
          node --check web/app.js
          node --check web/data-source.js
      - name: Install verified local globe assets
        run: python tools/setup_assets.py
      - name: Verify reviewed public graph
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          source = Path('public_data/network.json.gz')
          record = json.loads(Path('public_data/publication.json').read_text())
          assert hashlib.sha256(source.read_bytes()).hexdigest() == record['sha256']
          data = json.loads(gzip.decompress(source.read_bytes()))
          assert data['manifest']['metadata']['data_source'] == 'NAVIGRAPH'
          assert data['manifest']['metadata']['airac_cycle'] == '2610'
          assert len(data['waypoints']) == 257277 and len(data['segments']) == 91099
          assert 'signature' not in data['manifest']
          assert set(data['manifest']['metadata']) <= {'airac_cycle', 'data_source', 'valid_through'}
          print('Owner-authorised AIRAC 2610 graph integrity and metadata verified')
          PY
      - name: Build authorised Navigraph public site
        run: python tools/build_authorized_public.py --network public_data/network.json.gz --redistribution-approved --output _site
      - name: Verify deployment content
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('_site')
          data = json.loads(gzip.decompress((root / 'network.json.gz').read_bytes()))
          assert data['manifest']['metadata']['data_source'] == 'NAVIGRAPH'
          assert 'signature' not in data['manifest']
          assert not list(root.rglob('*.sqlite')) and not list(root.rglob('*.csv')) and not list(root.rglob('*.dat'))
          assert 'ATLAS_DATA_URL' in (root / 'index.html').read_text()
          print('Navigraph graph is the default public dataset; raw inputs excluded')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy public Navigraph viewer
        id: deployment
        uses: actions/deploy-pages@v4
